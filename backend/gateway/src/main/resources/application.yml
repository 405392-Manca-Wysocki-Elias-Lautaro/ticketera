server:
  port: 8080

spring:
  application:
    name: gateway
  main:
    web-application-type: reactive
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  cloud:
    gateway:
      httpclient:
        connect-timeout: 20000
        response-timeout: 30s
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
        - AddResponseHeader=Access-Control-Expose-Headers, Set-Cookie
      forwarded-headers-strategy: framework
      set-status:
        enabled: false
        
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: file:${JWT_PUBLIC_KEY_PATH:/app/keys/jwtRS256.key.pub}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 1000
      database: 0
      
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: INFO

gateway:
  public-routes:
    - /v3/api-docs/**
    - /swagger-ui/**
    - /swagger-ui.html
    - /actuator/health
    - /register
    - /resend-verification
    - /verify
    - /login
    - /validate
    - /forgot-password
    - /reset-password
    - /refresh
    - /_next/**
    - /__nextjs_original-stack-frames
    - /__nextjs_font/**
    - /textures/**
    - /assets/**
    - /favicon.ico
    - /manifest.webmanifest
    - /**

auth:
  service-url: ${AUTH_URL}