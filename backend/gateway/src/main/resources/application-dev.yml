spring:
  config:
    activate:
      on-profile: dev

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: false

  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:

        - id: static-next
          uri: http://frontend-dev:3000
          predicates:
            - Path=/favicon.ico, /manifest.webmanifest, /_next/**, /assets/**, /__nextjs_original-stack-frames, /__nextjs_font/**, /textures/**
          filters:
            - PreserveHostHeader

        - id: frontend
          uri: http://frontend-dev:3000
          predicates:
            - Path=/app/**
          filters:
            - PreserveHostHeader
            - RewritePath=/app/?(?<segment>.*), /${segment}

        - id: auth
          uri: "${SERVICES_AUTH_BASE_URL:http://auth-dev:8080}"
          predicates:
            - Path=/api/auth/**
          filters:
            - PreserveHostHeader
            - RewritePath=/api/auth/?(?<segment>.*), /${segment}
          order: -100
        
        - id: events
          uri: "${SERVICES_EVENT_BASE_URL:http://event-dev:8080}"
          predicates:
            - Path=/api/events/**
          filters:
            - PreserveHostHeader
            - RewritePath=/api/events/?(?<segment>.*), /${segment}
          order: -100

        - id: tickets
          uri: "${SERVICES_TICKET_BASE_URL:http://ticket-dev:8080}"
          predicates:
            - Path=/api/tickets/**
          filters:
            - PreserveHostHeader
            - RewritePath=/api/tickets/?(?<segment>.*), /${segment}
          order: -100

        - id: payments
          uri: "${SERVICES_PAYMENT_BASE_URL:http://payment-dev:8080}"
          predicates:
            - Path=/api/payments/**
          filters:
            - PreserveHostHeader
            - RewritePath=/api/payments/?(?<segment>.*), /${segment}
          order: -100

        # Webhook route for MercadoPago (public, no auth required) - alta prioridad
        - id: mercadopago-webhook
          uri: "${SERVICES_PAYMENT_BASE_URL:http://payment-dev:8080}"
          predicates:
            - Path=/webhook
          filters:
            - PreserveHostHeader
          order: -100

        - id: notifications
          uri: "${SERVICES_NOTIFICATION_BASE_URL:http://notification-dev:8080}"
          predicates:
            - Path=/api/notifications/**
          filters:
            - PreserveHostHeader
            - RewritePath=/api/notifications/?(?<segment>.*), /${segment}
          order: -100

        - id: orders
          uri: "${SERVICES_ORDER_BASE_URL:http://order-dev:8080}"
          predicates:
            - Path=/api/orders/**
          filters:
            - PreserveHostHeader
            - RewritePath=/api/orders/?(?<segment>.*), /${segment}
          order: -100

        # Frontend proxy - redirige todo lo que no sea API o webhook al frontend local
        # Usa host.docker.internal para acceder al localhost desde Docker
        # Orden alto (0 por defecto) para que se evalúe después de las rutas de API
        - id: frontend
          uri: "http://host.docker.internal:3000"
          predicates:
            - Path=/**
            - Method=GET,POST,PUT,DELETE,OPTIONS,PATCH
          filters:
            - PreserveHostHeader
          order: 0

        # --- OpenAPI aggregation ---
        - id: openapi-auth
          uri: http://auth-dev:8080
          predicates:
            - Path=/v3/api-docs/auth
          filters:
            - RewritePath=/v3/api-docs/auth, /v3/api-docs
        - id: openapi-events
          uri: http://event-dev:8080
          predicates:
            - Path=/v3/api-docs/events
          filters:
            - RewritePath=/v3/api-docs/events, /v3/api-docs
        - id: openapi-tickets
          uri: http://ticket-dev:8080
          predicates:
            - Path=/v3/api-docs/tickets
          filters:
            - RewritePath=/v3/api-docs/tickets, /v3/api-docs
        - id: openapi-payments
          uri: http://payment-dev:8080
          predicates:
            - Path=/v3/api-docs/payments
          filters:
            - RewritePath=/v3/api-docs/payments, /v3/api-docs
        - id: openapi-notifications
          uri: http://notification-dev:8080
          predicates:
            - Path=/v3/api-docs/notifications
          filters:
            - RewritePath=/v3/api-docs/notifications, /v3/api-docs
        - id: openapi-orders
          uri: http://order-dev:8080
          predicates:
            - Path=/v3/api-docs/orders
          filters:
            - RewritePath=/v3/api-docs/orders, /v3/api-docs

      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:3000"
              - "https://accepts-legislative-sara-pressed.trycloudflare.com"
            allowedMethods: "*"
            allowedHeaders: "*"
            exposedHeaders:
              - "Set-Cookie"
            allowCredentials: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    urls:
      - name: auth
        url: /v3/api-docs/auth
      - name: events
        url: /v3/api-docs/events
      - name: tickets
        url: /v3/api-docs/tickets
      - name: payments
        url: /v3/api-docs/payments
      - name: notifications
        url: /v3/api-docs/notifications
      - name: orders
        url: /v3/api-docs/orders
    persist-authorization: true
    try-it-out-enabled: true
    display-request-duration: true
    disable-swagger-default-url: true
    config-url: /v3/api-docs/swagger-config
  server-url: http://localhost:8080
  cors:
    enabled: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG
    org.springframework.security: DEBUG
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.web.reactive.function.client: TRACE
    org.springframework.web.reactive.function.server: TRACE

management:
  endpoint:
    health:
      show-details: always
